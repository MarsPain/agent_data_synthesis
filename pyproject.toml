[project]
name = "agent-data-synthesis"
version = "0.1.0"
description = "Executable Agent training data synthesis framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
agent-data-synthesis = "agent_synthesis.app:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_synthesis*"]
